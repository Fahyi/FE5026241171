<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyITS Music - Pendaftaran Anggota Baru</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      body {
        padding-top: 70px;
        font-family: 'Inter', sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      .brand-primary {
        background-color: #1a1a1a; /* Diubah ke hitam elegan khas musik */
        color: #ffc107; /* Aksen emas */
      }

      .navbar-dark .navbar-brand {
          color: #ffc107;
      }

      .brand-secondary {
        background-color: #f8f9fa;
        border-left: 5px solid #ffc107;
        color: black;
      }

      .event-carousel .carousel-inner {
        height: 400px;
        border-radius: 8px;
        overflow: hidden;
      }

      .event-carousel .carousel-item {
        height: 100%;
      }

      .event-carousel .carousel-item img {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }

      .selectable-label {
        background-color: white;
        margin-bottom: 0;
        cursor: pointer;
        transition: 0.2s;
      }
      
      .selectable-label:hover {
        background-color: #fff9e6;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-sm brand-primary navbar-dark fixed-top">
      <a class="navbar-brand font-weight-bold" href="#">MyITS Music</a>
    </nav>

    <main class="container mt-4 mb-5">
      <div class="jumbotron brand-secondary">
        <div class="row">
          <div class="col-md-2 col-4 mb-3 mb-md-0">
            <img
              class="w-100"
              src="https://upload.wikimedia.org/wikipedia/id/c/c4/Badge_ITS.png"
              alt="Logo ITS"
            />
          </div>
          <div class="col-md-10 col-12 align-self-center">
            <h1 class="font-weight-bold">Open Recruitment UKM Musik</h1>
            <p>Salurkan bakat senimu dan bergabunglah dengan komunitas musik terbesar di kampus!</p>
          </div>
        </div>
      </div>

      <div
        id="musicCarousel"
        class="event-carousel carousel slide mb-4"
        data-ride="carousel"
      >
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://images.unsplash.com/photo-1514525253344-99a42999659a?q=80&w=1074&auto=format&fit=crop"
              alt="Live Concert"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1170&auto=format&fit=crop"
              alt="Studio Recording"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=1170&auto=format&fit=crop"
              alt="Band Practice"
            />
          </div>
        </div>
        <a class="carousel-control-prev" href="#musicCarousel" data-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </a>
        <a class="carousel-control-next" href="#musicCarousel" data-slide="next">
          <span class="carousel-control-next-icon"></span>
        </a>
      </div>

      <form>
        <label class="font-weight-bold text-uppercase">Informasi Personal</label>

        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text">Nama Lengkap</span>
          </div>
          <input type="text" class="form-control" placeholder="Nama Depan" />
          <input type="text" class="form-control" placeholder="Nama Belakang" />
        </div>

        <div class="input-group mt-3 mb-3">
          <div class="input-group-prepend">
            <button
              type="button"
              class="btn btn-outline-dark dropdown-toggle"
              data-toggle="dropdown"
            >
              Fakultas
            </button>
            <div class="dropdown-menu">
              <a class="dropdown-item" href="#">FSAD</a>
              <a class="dropdown-item" href="#">FT-IRS</a>
              <a class="dropdown-item" href="#">FTSPK</a>
              <a class="dropdown-item" href="#">FTK</a>
              <a class="dropdown-item" href="#">FTEIC</a>
              <a class="dropdown-item" href="#">FDKBD</a>
              <a class="dropdown-item" href="#">Fakultas Vokasi</a>
            </div>
          </div>
          <input type="text" class="form-control" placeholder="Departemen (Contoh: Teknik Informatika)" />
        </div>

        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text">WhatsApp</span>
          </div>
          <input type="text" class="form-control" placeholder="08xxxxxxxxxx" />
        </div>

        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text">Email</span>
          </div>
          <input type="text" class="form-control" placeholder="NRP" />
          <div class="input-group-append">
            <span class="input-group-text">@student.its.ac.id</span>
          </div>
        </div>

        <label class="font-weight-bold">Jenis Kelamin</label>
        <div class="row mb-3">
          <div class="input-group col">
            <div class="input-group-prepend">
              <div class="input-group-text">
                <input type="radio" id="jk-laki" name="jenis_kelamin" />
              </div>
            </div>
            <label class="form-control selectable-label" for="jk-laki">Laki-laki</label>
          </div>
          <div class="input-group col">
            <div class="input-group-prepend">
              <div class="input-group-text">
                <input type="radio" id="jk-perempuan" name="jenis_kelamin" />
              </div>
            </div>
            <label class="form-control selectable-label" for="jk-perempuan">Perempuan</label>
          </div>
        </div>

        <label class="font-weight-bold">Bidang Minat (Bisa pilih lebih dari satu)</label>
        <div class="row">
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="vokal" /></div>
            </div>
            <label class="form-control selectable-label" for="vokal">Vokal</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="gitar" /></div>
            </div>
            <label class="form-control selectable-label" for="gitar">Gitar / Bass</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="keyboard" /></div>
            </div>
            <label class="form-control selectable-label" for="keyboard">Keyboard</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="drum" /></div>
            </div>
            <label class="form-control selectable-label" for="drum">Drum / Perkusi</label>
          </div>
        </div>

        <div class="row mb-3">
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="produser" /></div>
            </div>
            <label class="form-control selectable-label" for="produser">Produksi Musik</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="eo" /></div>
            </div>
            <label class="form-control selectable-label" for="eo">Event Organizer</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="visual" /></div>
            </div>
            <label class="form-control selectable-label" for="visual">Visual & Design</label>
          </div>
          <div class="input-group mb-2 col-md-3 col-6 input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text"><input type="checkbox" id="sound" /></div>
            </div>
            <label class="form-control selectable-label" for="sound">Sound Engineer</label>
          </div>
        </div>

        <label class="font-weight-bold">Opsi Keanggotaan</label>
        <div class="row mb-4">
          <div class="input-group col input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text">
                <input type="radio" id="reguler" name="membership" />
              </div>
            </div>
            <label class="form-control selectable-label" for="reguler">Anggota Reguler</label>
          </div>
          <div class="input-group col input-group-sm">
            <div class="input-group-prepend">
              <div class="input-group-text">
                <input type="radio" id="premium" name="membership" />
              </div>
            </div>
            <label class="form-control selectable-label" for="premium">Anggota Eksklusif (Akses Studio 24/7)</label>
          </div>
        </div>

        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Masukkan Kode Promo (Jika Ada)"
          />
          <div class="input-group-append">
            <button class="btn btn-dark" type="button">Cek Kode</button>
            <button class="btn btn-warning font-weight-bold" type="submit">Kirim Pendaftaran</button>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
